services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aeromesh
      POSTGRES_USER: aeromesh
      POSTGRES_PASSWORD: aeromesh
    ports:
      - "5432:5432"
    volumes:
      - aeromesh-postgis:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  aeromesh-postgis: