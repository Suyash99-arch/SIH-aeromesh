name: AeroMesh CI/CD Pipeline

on:
  push:
    branches:
      - main
      - aeromesh-v2
  pull_request:
    branches:
      - main
      - aeromesh-v2

jobs:
  backend-checks:
    name: Backend Tests & Security Audits
    runs-on: ubuntu-latest
    env:
      AEROMESH_AUTH_OPTIONAL: "1"
      SECRET_KEY: "ci-secret-key-testing-environment-purposes-only-32bytes"
      PYTHONPATH: "."
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Python Syntax Compilation Check
        run: |
          python -m py_compile backend/main.py backend/security.py backend/models.py backend/storage.py backend/reporting.py

      - name: Alembic Migration Revision Validation
        run: |
          python -m alembic heads

      - name: Download Canonical Detection Weights for CI Test Suite
        run: |
          mkdir -p backend/models
          python -c "import urllib.request; urllib.request.urlretrieve('https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt', 'backend/models/yolo11n.pt')"

      - name: Execute Security & Regression Test Suite
        run: |
          pytest backend/tests -v

  frontend-checks:
    name: Frontend Build & Playwright Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: ESLint Code Quality Audit
        working-directory: frontend
        run: npm run lint

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

  container-checks:
    name: Container Compose Configuration Validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: "ci-dummy-postgres-password"
      SECRET_KEY: "ci-dummy-secret-key-for-validation-purposes-32b"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config

  docker-build-and-test:
    name: Docker Build & 512MB RAM Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.api
        run: |
          docker build -f Dockerfile.api -t aeromesh-api:ci .

      - name: Build Dockerfile.worker
        run: |
          docker build -f Dockerfile.worker -t aeromesh-worker:ci .

      - name: Run API container with 512MB RAM constraint (-m 512m)
        run: |
          docker run -d \
            --name test-api \
            -m 512m \
            -p 8000:8000 \
            -e PORT=8000 \
            -e PIPELINE_ENABLED=false \
            -e ENVIRONMENT=development \
            -e SECRET_KEY="ci-secret-key-testing-environment-purposes-only-32bytes" \
            aeromesh-api:ci

      - name: Verify API container health and docs
        run: |
          echo "Waiting for API to boot..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/api/v1/health; then
              echo "API is healthy!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

          echo "Checking /api/v1/health:"
          curl -f http://localhost:8000/api/v1/health
          echo ""

          echo "Checking /docs:"
          curl -f http://localhost:8000/docs > /dev/null
          echo "Docs OK"

          echo "Checking memory footprint:"
          docker stats --no-stream test-api

      - name: Cleanup API container
        if: always()
        run: |
          docker logs test-api || true
          docker stop test-api || true
          docker rm test-api || true
