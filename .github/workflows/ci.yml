name: AeroMesh CI/CD Pipeline

on:
  push:
    branches:
      - main
      - aeromesh-v2
  pull_request:
    branches:
      - main
      - aeromesh-v2

jobs:
  backend-checks:
    name: Backend Tests & Security Audits
    runs-on: ubuntu-latest
    env:
      AEROMESH_AUTH_OPTIONAL: "1"
      SECRET_KEY: "ci-secret-key-testing-environment-purposes-only-32bytes"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyyaml

      - name: Python Syntax Compilation Check
        run: |
          python -m py_compile backend/main.py backend/security.py backend/models.py backend/storage.py backend/reporting.py

      - name: Alembic Migration Revision Validation
        run: |
          python -m alembic heads

      - name: Execute Security & Regression Test Suite
        run: |
          pytest backend/tests -v

  frontend-checks:
    name: Frontend Build & Playwright Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

  container-checks:
    name: Container Compose Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Docker Compose Configuration Syntax
        run: |
          python -c "import yaml; open('docker-compose.yml')"
